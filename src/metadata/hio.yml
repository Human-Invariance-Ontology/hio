# PURL configuration for http://purl.obolibrary.org/obo/hio

idspace: HIO
base_url: /obo/hio

products:
- hio.owl: https://raw.githubusercontent.com/human-invariance-ontology/hio/main/hio.owl
- hio.obo: https://raw.githubusercontent.com/human-invariance-ontology/hio/main/hio.obo

term_browser: ontobee
example_terms:
- HIO_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/human-invariance-ontology/hio/v

- prefix: /tracker/
  replacement: https://github.com/human-invariance-ontology/hio/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/HIO?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/human-invariance-ontology/hio/main/

